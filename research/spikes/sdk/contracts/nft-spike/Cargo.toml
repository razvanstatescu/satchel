[package]
name = "spike-nft"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
