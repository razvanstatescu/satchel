# THROWAWAY spike (sec): measure size/correctness of on-chain payload classifiers. Not product code.
[package]
name = "sec-parsers-spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
export = ["export-evm", "export-btc", "export-sol"]
export-evm = []
export-btc = []
export-sol = []
baseline = []
baseline-panic = []
alloy = ["dep:alloy-rlp"]  # EVM decode via alloy-rlp instead of hand-rolled

[dependencies]
alloy-rlp = { version = "0.3", optional = true, default-features = false }

[dev-dependencies]
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
