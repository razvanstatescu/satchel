[workspace]
resolver = "3"
members = ["contracts/satchel", "contracts/mock-signer", "contracts/mock-ft", "tests"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/satchelhq/satchel"   # placeholder (H-04): the code lives at github.com/razvanstatescu/satchel

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
