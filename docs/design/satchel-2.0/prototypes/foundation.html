<div data-scheme="day"></div>
<div data-scheme="night"></div>
</div>
<script>
  const t = document.getElementById("pane");
  document.querySelectorAll(".gal > [data-scheme]").forEach((el, i) => {
    const c = t.content.cloneNode(true);
    c.querySelectorAll("[id]").forEach((n) => n.id += "-" + i);
    c.querySelectorAll("[aria-labelledby]").forEach((n) => n.setAttribute("aria-labelledby", n.getAttribute("aria-labelledby") + "-" + i));
    c.querySelectorAll('input[name="theme-demo"]').forEach((n) => n.name = "theme-demo-" + i);
    el.appendChild(c);
  });
</script>
