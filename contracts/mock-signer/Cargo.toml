[package]
name = "mock-signer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Sandbox fixture mirroring v1.signer-prod.testnet 3.17.0 `sign` (yield/resume, timeout, failure modes)"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
